name: Build StepWay APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk StepWay.apk

      - name: Save APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: StepWay-APK
          path: StepWay.apk

      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "test-${GITHUB_RUN_NUMBER}" StepWay.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --title "StepWay test #${GITHUB_RUN_NUMBER}" \
            --notes "Тестовая сборка StepWay. Скачайте StepWay.apk на Android и установите."
